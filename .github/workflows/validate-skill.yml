name: Validate Beyond SEO
on:
  push:
    paths: ['skills/beyond-seo/**', '.github/workflows/validate-skill.yml']
  pull_request:
    paths: ['skills/beyond-seo/**', '.github/workflows/validate-skill.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r skills/beyond-seo/requirements.txt
      - run: python skills/beyond-seo/tools/validate_skill.py
      - run: python -m unittest discover -s skills/beyond-seo/tests -v
